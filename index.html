<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Aboard V11</title>
<style>

:root{
  --bg:#f4f7fb;--card:#fff;--ink:#102033;--muted:#6c7a8d;--line:#dfe6ef;
  --blue:#0b7df4;--green:#10a861;--purple:#7440e9;--shadow:0 14px 34px rgba(16,32,51,.12)
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 18px}
.brand{font-size:24px;font-weight:900}
.tag{font-size:12px;color:var(--muted)}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:800;font-size:16px;cursor:pointer}
.back{display:inline-block;color:var(--ink);text-decoration:none;font-weight:800}
.section{padding:18px}
label{display:block;font-weight:800;margin-bottom:7px}
input,select{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:13px;font-size:16px;background:#fff;color:var(--ink)}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.switch{position:relative;width:50px;height:28px;flex:0 0 auto}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;inset:0;background:#c8d0da;border-radius:999px;transition:.2s}
.slider:before{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}
.switch input:checked + .slider{background:var(--blue)}
.switch input:checked + .slider:before{transform:translateX(22px)}
.note{font-size:13px;color:var(--muted);line-height:1.45}

.hero{position:relative;overflow:hidden}
.hero-img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover}
.hero-fallback{height:300px;background:linear-gradient(135deg,#0b7df4,#102033);display:grid;place-items:center;color:#fff;font-size:46px;font-weight:900}
.overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03),rgba(0,0,0,.4))}
.hero-copy{position:absolute;left:20px;right:20px;bottom:20px;color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.5)}
.hero-copy h1{margin:0;font-size:38px;line-height:1}
.hero-copy p{margin:8px 0 0;font-size:15px;font-weight:600}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:18px}
.tile{min-height:160px;border-radius:22px;padding:18px;color:#fff;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;box-shadow:var(--shadow)}
.tile.blue{background:linear-gradient(135deg,#0b7df4,#0571e6)}
.tile.green{background:linear-gradient(135deg,#14b96d,#089d59)}
.tile.purple{background:linear-gradient(135deg,#8650ef,#6735dd)}
.tile.gray{background:linear-gradient(135deg,#eef1f5,#dde3ea);color:var(--ink);grid-column:1 / -1}
.icon{font-size:38px}
.tile h2{margin:8px 0 6px;font-size:22px}
.tile p{margin:0;font-size:13px;line-height:1.35;opacity:.95}
.chev{align-self:flex-end;background:rgba(255,255,255,.9);color:var(--ink);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;margin-top:10px}
@media(max-width:390px){.menu{grid-template-columns:1fr}.tile.gray{grid-column:auto}.hero-copy h1{font-size:32px}}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <img src="assets/all-aboard-melbourne.png" alt="Melbourne train at Flinders Street with the MCG in the background" class="hero-img">
    <div class="overlay"></div>
    <div class="hero-copy">
      <h1>All Aboard</h1>
      <p>Talk to the people travelling with you.</p>
    </div>
  </div>

  <div class="menu">
    <a class="tile blue" href="live_trains.html">
      <div><div class="icon">🚆</div><h2>Live Trains</h2><p>See scheduled Hurstbridge train positions and the City Loop.</p></div>
      <div class="chev">›</div>
    </a>
<a class="tile purple" href="chat.html">
      <div><div class="icon">💬</div><h2>Chat</h2><p>Join the conversation for your train.</p></div>
      <div class="chev">›</div>
    </a>
    <a class="tile gray" href="settings.html">
      <div><div class="icon">⚙️</div><h2>Settings</h2><p>Optional profile, privacy and notification preferences.</p></div>
      <div class="chev">›</div>
    </a>
  </div>
</div>
</body>
</html>
