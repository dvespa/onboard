<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>All Aboard V12</title>
<style>
:root{
  --bg:#f4f7fb;--card:#fff;--ink:#102033;--muted:#6c7a8d;
  --blue:#0b7df4;--purple:#7440e9;--line:#dfe6ef;
  --shadow:0 10px 24px rgba(16,32,51,.12)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}
body{min-height:100svh}
.app{
  max-width:520px;
  margin:auto;
  min-height:100svh;
  background:#fff;
  display:flex;
  flex-direction:column;
}
.hero{
  position:relative;
  height:31svh;
  min-height:205px;
  max-height:265px;
  overflow:hidden;
  background:#102033;
}
.hero img{
  width:100%;
  height:100%;
  display:block;
  object-fit:cover;
  object-position:center 42%;
}
.hero:after{
  content:"";
  position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(0,0,0,.03) 40%,rgba(0,0,0,.38));
}
.hero-copy{
  position:absolute;
  z-index:2;
  left:18px;
  right:18px;
  bottom:14px;
  color:white;
  text-shadow:0 2px 8px rgba(0,0,0,.55);
}
.hero-copy h1{
  margin:0;
  font-size:31px;
  line-height:1;
  font-weight:950;
}
.hero-copy p{
  margin:5px 0 0;
  font-size:13px;
  font-weight:700;
}
.menu{
  flex:1;
  padding:12px 14px calc(14px + env(safe-area-inset-bottom));
  display:grid;
  grid-template-rows:repeat(3,1fr);
  gap:10px;
  min-height:0;
}
.tile{
  border-radius:19px;
  padding:14px 16px;
  text-decoration:none;
  display:grid;
  grid-template-columns:58px 1fr 38px;
  gap:12px;
  align-items:center;
  box-shadow:var(--shadow);
  min-height:0;
}
.tile.blue{background:linear-gradient(135deg,#0c82fb,#0871de);color:#fff}
.tile.purple{background:linear-gradient(135deg,#8650ef,#6735dd);color:#fff}
.tile.gray{background:linear-gradient(135deg,#f3f5f8,#e4e9ef);color:var(--ink)}
.icon{
  width:54px;height:54px;border-radius:50%;
  display:grid;place-items:center;
  font-size:29px;
  background:rgba(255,255,255,.17);
}
.tile.gray .icon{background:#d6dde6}
.copy h2{margin:0 0 3px;font-size:20px;line-height:1.05}
.copy p{margin:0;font-size:12px;line-height:1.25;opacity:.94}
.chev{
  width:34px;height:34px;border-radius:50%;
  display:grid;place-items:center;
  font-size:24px;font-weight:900;
  background:rgba(255,255,255,.92);
  color:#102033;
}
@media (max-height:700px){
  .hero{height:28svh;min-height:175px}
  .menu{gap:8px;padding-top:9px}
  .tile{padding:10px 13px;grid-template-columns:48px 1fr 32px}
  .icon{width:46px;height:46px;font-size:25px}
  .copy h2{font-size:18px}
  .copy p{font-size:11px}
  .chev{width:30px;height:30px;font-size:21px}
}
</style>
</head>
<body>
<div class="app">
  <div class="hero">
    <img src="assets/all-aboard-hero-compact.png" alt="Melbourne train at Flinders Street with the MCG in the background">
    <div class="hero-copy">
      <h1>All Aboard</h1>
      <p>Talk to the people travelling with you.</p>
    </div>
  </div>

  <div class="menu">
    <a class="tile blue" href="live_trains.html">
      <div class="icon">🚆</div>
      <div class="copy">
        <h2>Live Trains</h2>
        <p>See scheduled Hurstbridge train positions and the City Loop.</p>
      </div>
      <div class="chev">›</div>
    </a>

    <a class="tile purple" href="chat.html">
      <div class="icon">💬</div>
      <div class="copy">
        <h2>Chat</h2>
        <p>Chat only with travellers verified on your service.</p>
      </div>
      <div class="chev">›</div>
    </a>

    <a class="tile gray" href="settings.html">
      <div class="icon">⚙️</div>
      <div class="copy">
        <h2>Settings</h2>
        <p>Optional profile, privacy and notification preferences.</p>
      </div>
      <div class="chev">›</div>
    </a>
  </div>
</div>
</body>
</html>
